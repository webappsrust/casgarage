services:
  casgarage:
    image: casgarage:dev
    container_name: casgarage
    hostname: casgarage
    ports:
      - "172.17.0.1:64900:80"
    volumes:
      - ./rootfs/data/casgarage:/data
      - ./rootfs/config/casgarage:/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DATA_DIR=/data
      - CONFIG_DIR=/config
      - LOG_DIR=/var/log/casgarage
      - RUST_LOG=info
      - TMPDIR=/tmp/casgarage
    restart: unless-stopped
    networks:
      - casgarage
    healthcheck:
      test: ["CMD", "/usr/local/bin/casgarage", "--status"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  casgarage:
    name: casgarage
    driver: bridge
    external: false
