apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: casgarage
  namespace: casgarage
spec:
  serviceName: casgarage
  replicas: 3
  selector:
    matchLabels:
      app: casgarage
  template:
    metadata:
      labels:
        app: casgarage
    spec:
      containers:
      - name: casgarage
        image: casapps/casgarage:latest
        ports:
        - containerPort: 3900
          name: admin
        - containerPort: 3901
          name: s3
        - containerPort: 9090
          name: metrics
        env:
        - name: CASGARAGE_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CASGARAGE_REPLICATION_FACTOR
          value: "3"
        - name: RUST_LOG
          value: "info"
        - name: TMPDIR
          value: "/tmp/casgarage"
        volumeMounts:
        - name: data
          mountPath: /data/casgarage
        - name: tmp
          mountPath: /tmp/casgarage
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/casgarage
            - health
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - /usr/local/bin/casgarage
            - health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 100Gi
  - metadata:
      name: tmp
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi
